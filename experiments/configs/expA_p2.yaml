# Experiment A, arm B: prompt p2 (spec section 16). Pre-registered in docs/decisions/decisions.md,
# 2026-10-18, before any live call.
#
# Identical to baseline_v1.yaml except `experiment_id`, `prompt_version` and `dataset.prefer_run`.
# The prompt is the only variable. max_steps stays 20 although p2 asks for more searches: a trial
# that runs out of steps is part of p2's measured cost, not a reason to change a second variable.
#
# The API key is NOT here and must never be. It is read from GOOGLE_API_KEY at run time.

experiment_id: expA_p2
agent_version: v1
prompt_version: p2
tool_set_version: t1

model:
  provider: google-ai-studio
  name: gemini-3.5-flash-lite
  tag: gemini-3.5-flash-lite
  temperature: 0.0
  top_p: 1.0
  seed: 7
  max_output_tokens: 2048
  thinking_level: MINIMAL

agent:
  max_steps: 20

dataset:
  version: v1
  policy_id: POL-001
  cases_per_category: 20
  sample_seed: 7
  # Pins the sample to the 140 cases p1 was measured on. Category-interleaved order makes the first
  # 56 trials 8 per category: the pre-registered interim look.
  prefer_run: baseline_v1-20261002T092914Z

run:
  trials_per_case: 1

quota:
  max_retries: 8
  initial_backoff_seconds: 5
  backoff_multiplier: 2
  max_backoff_seconds: 90
